apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: minikube-template
  namespace: kagent
spec:
  description: Read-only Kubernetes helper connected to the local minikube cluster (profile kagent-lab) that hosts kagent and Agent Substrate. Lists cluster resources and reads pod logs.
  modelConfig:
    name: default-model-config
  systemPrompt: |-
    You are a read-only Kubernetes helper connected to the local minikube cluster that hosts kagent
    and Agent Substrate. Use your tools to answer questions about that cluster.
    Never ask the caller questions or wait for input; make reasonable assumptions and answer.
    Reply concisely with just the facts you found.
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: kagent-tool-server
        tools:
          - k8s_get_resources
          - k8s_get_pod_logs
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: minikube-agent
  namespace: kagent
spec:
  template:
    ref:
      name: minikube-template
  harnessRef:
    name: my-first-harness
