apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: k8s-template
  namespace: kagent
spec:
  description: Read-only Kubernetes helper. Lists cluster resources and reads pod logs for the local cluster.
  modelConfig:
    name: default-model-config
  systemPrompt: |-
    You are a read-only Kubernetes helper. Use your tools to answer cluster questions.
    Never ask the caller questions or wait for input; make reasonable assumptions and answer.
    Reply concisely with just the facts you found.
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: kagent-tool-server
        tools:
          - k8s_get_resources
          - k8s_get_pod_logs
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: k8s-agent
  namespace: kagent
spec:
  template:
    ref:
      name: k8s-template
  harnessRef:
    name: my-first-harness
